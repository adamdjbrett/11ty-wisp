name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Let a newer push supersede an in-flight PR build, but never cancel a
# deploy that is already talking to Cloudflare.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build${{ github.ref == 'refs/heads/main' && ' and deploy' || '' }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          # Same file Cloudflare's build image reads, so CI and the hosted
          # build always agree on the Node version.
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Upload build output
        uses: actions/upload-artifact@v6
        with:
          name: site
          path: _site
          retention-days: 7

      - name: Deploy to Cloudflare
        id: deploy
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Pinned to the major so the deploy does not drift; wrangler reads
          # the assets config from wrangler.jsonc.
          wranglerVersion: "4"
          command: deploy

      - name: Record deployment URL
        if: steps.deploy.outcome == 'success'
        run: |
          echo "Deployed to ${{ steps.deploy.outputs.deployment-url }}" >> "$GITHUB_STEP_SUMMARY"
